<script>
// ==================== نظام إدارة النوافذ المفتوحة ====================
const openPanelsStack = []; // مكدس لتتبع النوافذ المفتوحة

// ==================== فتح نافذة (بانل) ====================
function showPanel(id, el) {
  // إخفاء جميع البانلات أولاً
  document.querySelectorAll('.panel').forEach(p => p.style.right = "-100%");
  
  // إظهار البانل المطلوب
  const panel = document.getElementById(id);
  if (panel) {
    panel.style.right = "0";
    // إضافة للنافذة للمكدس
    if (!openPanelsStack.includes(id)) {
      openPanelsStack.push(id);
    }
  }

  // تحديث الأيقونات النشطة
  document.querySelectorAll('.icon').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  
  // إضافة حالة للتاريخ
  history.pushState({ panelId: id, action: 'open' }, '', window.location.href);
}

// ==================== إخفاء نافذة (بانل) ====================
function hidePanel(id) {
  const panel = document.getElementById(id);
  if (panel) {
    panel.style.right = "-100%";
  }
  
  // إزالة النافذة من المكدس
  const index = openPanelsStack.indexOf(id);
  if (index > -1) {
    openPanelsStack.splice(index, 1);
  }
  
  // إزالة الحالة النشطة من الأيقونات
  document.querySelectorAll('.icon').forEach(i => i.classList.remove('active'));
}

// ==================== إغلاق جميع النوافذ المفتوحة ====================
function closeAllPanels() {
  document.querySelectorAll('.panel').forEach(p => p.style.right = "-100%");
  openPanelsStack.length = 0; // تفريغ المكدس
  document.querySelectorAll('.icon').forEach(i => i.classList.remove('active'));
  
  // إزالة النوافذ المنشأة ديناميكياً
  document.querySelectorAll('.panel[data-dynamic="true"]').forEach(p => p.remove());
}

// ==================== إغلاق آخر نافذة مفتوحة ====================
function closeLastPanel() {
  if (openPanelsStack.length > 0) {
    const lastPanelId = openPanelsStack.pop(); // أخذ آخر نافذة
    hidePanel(lastPanelId);
    return true; // تم إغلاق نافذة
  }
  
  // التحقق من النوافذ الديناميكية
  const dynamicPanels = document.querySelectorAll('.panel[data-dynamic="true"]');
  if (dynamicPanels.length > 0) {
    const lastDynamic = dynamicPanels[dynamicPanels.length - 1];
    lastDynamic.remove();
    return true; // تم إغلاق نافذة ديناميكية
  }
  
  return false; // لا توجد نوافذ للإغلاق
}

// ==================== زر الرجوع في الموبايل ====================
window.addEventListener('popstate', function(event) {
  if (event.state && event.state.action === 'open') {
    // إذا كان هناك حالة سابقة، نغلق النافذة الحالية
    const closed = closeLastPanel();
    
    if (closed) {
      // منع الرجوع للصفحة السابقة إذا تم إغلاق نافذة
      history.pushState({ action: 'prevent' }, '', window.location.href);
    }
  } else {
    // إذا لم تكن هناك نوافذ مفتوحة، نغلق جميع النوافذ
    const hasOpenPanels = document.querySelectorAll('.panel[style*="right: 0px"], .panel[style*="right:0px"]').length > 0;
    
    if (hasOpenPanels) {
      closeAllPanels();
      history.pushState({ action: 'prevent' }, '', window.location.href);
    }
  }
});

// ==================== معالجة زر الرجوع الفعلي ====================
// إضافة حالة أولية للتاريخ
history.pushState({ action: 'initial' }, '', window.location.href);

// معالجة إضافية لضمان عمل زر الرجوع
window.addEventListener('load', function() {
  history.pushState({ action: 'loaded' }, '', window.location.href);
});

// ==================== فتح الملف الشخصي ====================
function openProfile() {
  // إنشاء نافذة جديدة للملف الشخصي
  let profileWin = document.createElement("div");
  profileWin.className = "panel";
  profileWin.style.right = "0";
  profileWin.id = "profilePanel";
  profileWin.setAttribute('data-dynamic', 'true');
  
  profileWin.innerHTML = `
    <div class="hideBtn" onclick="closeDynamicPanel(this.parentElement)">×</div>
    <iframe src="https://amanhsn55555-eng.github.io/Mlf-chat/" id="profileIframe"></iframe>
  `;
  
  document.body.appendChild(profileWin);
  
  // إضافة للمكدس
  if (!openPanelsStack.includes('profilePanel')) {
    openPanelsStack.push('profilePanel');
  }
  
  // إضافة حالة للتاريخ
  history.pushState({ panelId: 'profilePanel', action: 'open' }, '', window.location.href);
  
  // الاستماع لرسائل من iframe الملف الشخصي
  window.addEventListener('message', handleProfileMessage);
}

// ==================== إغلاق نافذة ديناميكية ====================
function closeDynamicPanel(panelElement) {
  if (panelElement) {
    const panelId = panelElement.id;
    panelElement.remove();
    
    // إزالة من المكدس
    const index = openPanelsStack.indexOf(panelId);
    if (index > -1) {
      openPanelsStack.splice(index, 1);
    }
  }
}

// ==================== معالجة رسائل الخصوصية ====================
function handleProfileMessage(event) {
  if (event.origin !== 'https://amanhsn55555-eng.github.io') return;
  
  const data = event.data;
  
  if (data.type === 'privacyStatus') {
    const isPrivate = data.isPrivate;
    
    if (isPrivate) {
      console.log('🔒 الخاص مغلق - لا يمكن المراسلة');
      showPrivacyAlert('🔒 هذا المستخدم أغلق الخاص ولا يمكن مراسلته');
    } else {
      console.log('🔓 الخاص مفتوح - يمكن المراسلة');
    }
  }
  
  if (data.type === 'requestMessage') {
    const targetUserId = data.userId;
    const isPrivate = data.isPrivate;
    
    if (isPrivate) {
      showPrivacyAlert('🔒 عذراً، هذا المستخدم أغلق الخاص ولا يستقبل رسائل حالياً');
    } else {
      openMessageWindow(targetUserId);
    }
  }
  
  if (data.type === 'updateAvatar') {
    updateProfileIcon(data.avatarUrl, data.emoji);
  }
}

// ==================== إظهار تنبيه الخصوصية ====================
function showPrivacyAlert(message) {
  const alertDiv = document.createElement('div');
  alertDiv.className = 'privacy-alert';
  alertDiv.textContent = message;
  document.body.appendChild(alertDiv);
  
  setTimeout(() => {
    alertDiv.remove();
  }, 3000);
}

// ==================== فتح نافذة المراسلة ====================
function openMessageWindow(userId) {
  // إغلاق نافذة الملف الشخصي أولاً
  const profilePanel = document.getElementById('profilePanel');
  if (profilePanel) {
    closeDynamicPanel(profilePanel);
  }
  
  // فتح نافذة المراسلة
  let msgWin = document.createElement("div");
  msgWin.className = "panel";
  msgWin.style.right = "0";
  msgWin.id = "messagePanel";
  msgWin.setAttribute('data-dynamic', 'true');
  
  msgWin.innerHTML = `
    <div class="hideBtn" onclick="closeDynamicPanel(this.parentElement)">×</div>
    <iframe src="https://amanhsn55555-eng.github.io/Msgtdy?user=${userId}"></iframe>
  `;
  
  document.body.appendChild(msgWin);
  
  // إضافة للمكدس
  if (!openPanelsStack.includes('messagePanel')) {
    openPanelsStack.push('messagePanel');
  }
  
  // إضافة حالة للتاريخ
  history.pushState({ panelId: 'messagePanel', action: 'open' }, '', window.location.href);
}

// ==================== عرض صفحة الأثرياء ====================
function showRichPanel() {
  document.querySelectorAll('.panel').forEach(p => p.style.right = "-100%");
  
  let richWin = document.createElement("div");
  richWin.className = "panel";
  richWin.style.right = "0";
  richWin.id = "richPanel";
  richWin.setAttribute('data-dynamic', 'true');
  
  richWin.innerHTML = `
    <div class="hideBtn" onclick="closeDynamicPanel(this.parentElement)">×</div>
    <iframe src="https://amanhsn55555-eng.github.io/Athreaa-man-chat/"></iframe>
  `;
  
  document.body.appendChild(richWin);
  
  // إضافة للمكدس
  if (!openPanelsStack.includes('richPanel')) {
    openPanelsStack.push('richPanel');
  }
  
  // إضافة حالة للتاريخ
  history.pushState({ panelId: 'richPanel', action: 'open' }, '', window.location.href);
}

// ==================== فتح صفحة فرعية ====================
function openSub(link) {
  let win = document.createElement("div");
  win.className = "panel";
  win.style.right = "0";
  win.id = "subPanel_" + Date.now();
  win.setAttribute('data-dynamic', 'true');

  win.innerHTML = `
    <div class="hideBtn" onclick="closeDynamicPanel(this.parentElement)">×</div>
    <iframe src="${link}"></iframe>
  `;

  document.body.appendChild(win);
  
  // إضافة للمكدس
  if (!openPanelsStack.includes(win.id)) {
    openPanelsStack.push(win.id);
  }
  
  // إضافة حالة للتاريخ
  history.pushState({ panelId: win.id, action: 'open' }, '', window.location.href);
}

// ==================== تحديث أيقونة الملف الشخصي ====================
function updateProfileIcon(avatarUrl, emoji) {
  const profileIcon = document.getElementById('profileNavIcon');
  if (profileIcon) {
    if (avatarUrl) {
      profileIcon.innerHTML = `<img src="${avatarUrl}" alt="profile">`;
    } else if (emoji) {
      profileIcon.innerHTML = `<span>${emoji}</span>`;
    }
  }
}

// ==================== منع الخروج من الصفحة ====================
window.addEventListener('beforeunload', function(e) {
  // يمكنك إضافة تحذير إذا كانت هناك نوافذ مفتوحة
  const hasOpenPanels = document.querySelectorAll('.panel[style*="right: 0px"], .panel[style*="right:0px"]').length > 0;
  if (hasOpenPanels) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
